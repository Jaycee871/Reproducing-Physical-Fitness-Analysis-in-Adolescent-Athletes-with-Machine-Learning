name: Fetch original research materials

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-original-materials:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gdown
        run: python -m pip install --upgrade pip gdown

      - name: Download original implementation notebook
        run: |
          mkdir -p original notes
          curl -L "https://raw.githubusercontent.com/YunhwanJacobLee/Essential-elements-of-physical-fitness-analysis/main/implementation.ipynb" -o original/implementation.ipynb

      - name: Download original dataset
        run: |
          gdown "https://drive.google.com/file/d/1FQsj7kzYsinjBG_7tfz67fqtsuhNiAef/view?usp=sharing" -O original/

      - name: Generate SHA-256 checksums
        run: |
          find original -maxdepth 1 -type f ! -name ".gitkeep" -print0 | sort -z | xargs -0 sha256sum > notes/original_sha256.txt
          cat notes/original_sha256.txt

      - name: Update source inventory
        shell: bash
        run: |
          {
            echo "# Source Inventory"
            echo
            echo "This document records the original research materials preserved for the reproduction of Lee et al. (2024), *Essential elements of physical fitness analysis in male adolescent athletes using machine learning*."
            echo
            echo "## Preserved original materials"
            echo
            echo "| File name | Source | Purpose | Modified? |"
            echo "|---|---|---|---|"
            for file in original/*; do
              [ -f "$file" ] || continue
              name="$(basename "$file")"
              if [ "$name" = "implementation.ipynb" ]; then
                echo "| `$name` | Original authors' GitHub repository | Original machine-learning implementation notebook | No |"
              else
                echo "| `$name` | Original authors' Google Drive | Original dataset supplied with the study | No |"
              fi
            done
            echo
            echo "## Preservation rule"
            echo
            echo "Files inside `original/` must remain unchanged."
            echo
            echo "Any debugging, preprocessing, environment adaptation, or experimental changes must be performed only on copies stored in `reproduction/`."
            echo
            echo "## Integrity verification"
            echo
            echo "SHA-256 checksums are stored in `notes/original_sha256.txt`."
          } > notes/source_inventory.md

      - name: Commit preserved materials
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add original notes
          if git diff --cached --quiet; then
            echo "No repository changes to commit."
          else
            git commit -m "Add preserved original research materials"
            git push
          fi
