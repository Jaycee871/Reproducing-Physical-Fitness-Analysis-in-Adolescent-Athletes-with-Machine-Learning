name: Render Chinese reproduction poster

on:
  workflow_dispatch:
  push:
    paths:
      - "poster/poster.html"
      - "poster/render_poster.py"

permissions:
  contents: write

jobs:
  render-poster:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade playwright
          python -m playwright install --with-deps chromium

      - name: Render poster
        run: python poster/render_poster.py

      - name: Commit rendered poster
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poster/poster.pdf poster/poster.png
          if git diff --cached --quiet; then
            echo "No rendered-poster changes to commit."
          else
            git commit -m "Render Chinese reproduction poster"
            git push
          fi
