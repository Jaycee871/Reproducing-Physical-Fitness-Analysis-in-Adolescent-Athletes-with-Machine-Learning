name: Preprocessing reconstruction audit

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocessing-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install preprocessing dependencies
        run: python -m pip install --upgrade pandas scikit-learn imbalanced-learn

      - name: Reconstruct preprocessing pipeline
        run: python reproduction/reconstruct_preprocessing.py

      - name: Show reconstruction report
        run: |
          echo "=== Preprocessing Reconstruction Audit ==="
          cat notes/preprocessing_reconstruction.md

      - name: Commit reconstruction report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/preprocessing_reconstruction.md
          if git diff --cached --quiet; then
            echo "No reconstruction changes to commit."
          else
            git commit -m "Add preprocessing reconstruction audit"
            git push
          fi
